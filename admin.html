<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>제작자 페이지 · 하트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --accent: #8b7cf0;
      --accent-dark: #7464e6;
      --soft: #f1eefe;
      --grad: linear-gradient(120deg, #a993f4 0%, #8fb2f3 50%, #74c6f0 100%);
      --ink: #14171a;
      --sub: #657786;
      --faint: #aab8c2;
      --line: #e6ecf0;
      --page: #f5f8fa;
      --danger: #e0245e;
      --sans: "Pretendard Variable", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--page); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    .hidden { display: none !important; }

    /* ---------- 잠금 화면 ---------- */
    .lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .lock-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 360px; text-align: center; }
    .lock-card .heart { width: 44px; height: 44px; margin: 0 auto 14px; }
    .lock-card h1 { font-size: 1.2rem; font-weight: 800; }
    .lock-card p { color: var(--sub); font-size: .88rem; margin: 6px 0 20px; }
    .lock-card input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; text-align: center; }
    .lock-card input:focus { border-color: var(--accent); }
    .lock-err { color: var(--danger); font-size: .82rem; min-height: 1.3em; margin-top: 8px; }

    /* ---------- 공통 ---------- */
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 140px; }
    header.top {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,255,255,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .top-inner { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .top-inner .heart { width: 24px; height: 24px; }
    .top-inner h1 { font-size: 1.05rem; font-weight: 800; flex: 1; }
    .link-btn { font-size: .82rem; color: var(--accent); font-weight: 700; padding: 6px 10px; border-radius: 999px; }
    .link-btn:hover { background: var(--soft); }

    .btn { border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: .88rem; transition: filter .15s, background .15s; }
    .btn-main { background: var(--grad); color: #fff; }
    .btn-main:hover { filter: brightness(.96); }
    .btn-line { border: 1.5px solid var(--accent); color: var(--accent); background: #fff; }
    .btn-line:hover { background: var(--soft); }
    .btn-ghost { background: #eef1f4; color: var(--ink); }
    .btn-danger { color: var(--danger); background: #fdecf2; }
    .btn:disabled { opacity: .5; cursor: default; }

    .banner {
      margin: 14px 0 0; padding: 12px 14px; border-radius: 12px;
      background: var(--soft); color: #4b3fb8; font-size: .86rem;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .banner span { flex: 1; min-width: 200px; }

    .tabs { display: flex; margin: 16px 0 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    .tab { flex: 1; padding: 9px 0; border-radius: 9px; font-weight: 700; font-size: .88rem; color: var(--sub); }
    .tab.active { background: var(--grad); color: #fff; }

    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; }
    .section-head h2 { font-size: 1rem; font-weight: 800; }
    .hint { font-size: .8rem; color: var(--sub); }

    /* ---------- 목록 ---------- */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; gap: 12px; align-items: center; }
    .thumb { width: 52px; aspect-ratio: 987 / 1216; border-radius: 8px; object-fit: cover; background: var(--soft); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 800; }
    .item-main { flex: 1; min-width: 0; }
    .item-title { font-weight: 800; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: .78rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-block; font-size: .66rem; font-weight: 800; padding: 1px 6px; border-radius: 5px; background: var(--soft); color: var(--accent); margin-left: 4px; vertical-align: 1px; }
    .badge.new { background: #e8f8ef; color: #17a35a; }
    .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--sub); }
    .icon:hover { background: var(--soft); color: var(--accent); }
    .icon.del:hover { background: #fdecf2; color: var(--danger); }
    .icon svg { width: 17px; height: 17px; }
    .icon:disabled { opacity: .25; cursor: default; background: none; }
    .empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: .9rem; background: #fff; border: 1px dashed var(--line); border-radius: 14px; }

    /* ---------- 편집 창 ---------- */
    .overlay { position: fixed; inset: 0; z-index: 30; background: rgba(108, 96, 160, .35); display: none; align-items: flex-start; justify-content: center; padding: 4vh 12px; overflow-y: auto; }
    .overlay.open { display: flex; }
    .editor { background: #fff; width: 100%; max-width: 560px; border-radius: 18px; overflow: hidden; }
    .ed-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .ed-top h3 { font-size: 1rem; font-weight: 800; }
    .ed-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .ed-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); background: #fbfcfd; }
    label.f { display: flex; flex-direction: column; gap: 5px; font-size: .82rem; font-weight: 700; color: #3d4650; }
    label.f small { font-weight: 400; color: var(--sub); }
    .f input[type=text], .f input[type=url], .f input[type=date], .f input[type=number], .f textarea, .f input[type=password] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; font-weight: 400; background: #fff;
    }
    .f textarea { min-height: 90px; resize: vertical; line-height: 1.55; }
    .f input:focus, .f textarea:focus { border-color: var(--accent); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .check { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; }
    .check input { width: 18px; height: 18px; accent-color: var(--accent); }
    .tag-pick { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-pick button { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: .82rem; font-weight: 600; color: var(--sub); }
    .tag-pick button.on { background: var(--grad); border-color: transparent; color: #fff; }

    .img-box { display: flex; gap: 14px; align-items: flex-start; }
    .img-prev { width: 120px; aspect-ratio: 987 / 1216; border-radius: 12px; background: var(--soft); border: 1px dashed #cfc4fa; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: .78rem; text-align: center; }
    .img-prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-side { flex: 1; display: flex; flex-direction: column; gap: 8px; font-size: .82rem; color: var(--sub); }
    .img-side input[type=range] { width: 100%; accent-color: var(--accent); }
    .file-btn { position: relative; overflow: hidden; display: inline-flex; align-self: flex-start; }
    .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* ---------- 하단 바 ---------- */
    .bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: rgba(255,255,255,.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
    }
    .bottom-inner { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
    .bottom-inner .status { flex: 1; font-size: .8rem; color: var(--sub); }
    .bottom-inner .status b { color: var(--accent); }

    .done-card { text-align: left; }
    .done-card ol { padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
    .done-card code { background: var(--soft); padding: 1px 6px; border-radius: 5px; font-size: .85rem; }

    .toast { position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 20px); background: var(--grad); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .86rem; font-weight: 600; opacity: 0; pointer-events: none; transition: all .3s; z-index: 60; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a2f6"/><stop offset=".55" stop-color="#9ab9f5"/><stop offset="1" stop-color="#7fcdf2"/></linearGradient></defs>
  </svg>

  <!-- 잠금 화면 -->
  <section class="lock" id="lockView">
    <form class="lock-card" id="lockForm">
      <svg class="heart" viewBox="0 0 24 24"><path fill="url(#hg)" d="M12 21.2s-8.6-5.2-10.4-10.6C.3 6.6 2.8 2.8 6.7 2.8c2.3 0 4.1 1.2 5.3 3.1 1.2-1.9 3-3.1 5.3-3.1 3.9 0 6.4 3.8 5.1 7.8C20.6 16 12 21.2 12 21.2z"/></svg>
      <h1>제작자 페이지</h1>
      <p>비밀번호를 입력해주세요</p>
      <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" />
      <div class="lock-err" id="pwErr"></div>
      <button class="btn btn-main" style="width:100%;margin-top:6px" type="submit">들어가기</button>
    </form>
  </section>

  <!-- 관리 화면 -->
  <div id="appView" class="hidden">
    <header class="top">
      <div class="top-inner">
        <svg class="heart" viewBox="0 0 24 24"><path fill="url(#hg)" d="M12 21.2s-8.6-5.2-10.4-10.6C.3 6.6 2.8 2.8 6.7 2.8c2.3 0 4.1 1.2 5.3 3.1 1.2-1.9 3-3.1 5.3-3.1 3.9 0 6.4 3.8 5.1 7.8C20.6 16 12 21.2 12 21.2z"/></svg>
        <h1>제작자 페이지</h1>
        <a class="link-btn" href="index.html" target="_blank" rel="noopener">사이트 보기 ↗</a>
        <button class="link-btn" id="settingsBtn">⚙️ 연결</button>
        <button class="link-btn" id="logoutBtn">잠그기</button>
      </div>
    </header>

    <div class="wrap">
      <div class="banner hidden" id="draftBanner"></div>

      <nav class="tabs">
        <button class="tab active" data-tab="posts">게시물</button>
        <button class="tab" data-tab="notices">공지</button>
        <button class="tab" data-tab="tags">해시태그</button>
      </nav>

      <section id="tab-posts">
        <div class="section-head">
          <div><h2>게시물</h2><div class="hint">위에 있을수록 최신으로 보여요</div></div>
          <button class="btn btn-main" id="newPost">+ 새 게시물</button>
        </div>
        <div class="list" id="postList"></div>
      </section>

      <section id="tab-notices" class="hidden">
        <div class="section-head">
          <div><h2>공지</h2><div class="hint">공지 탭에만 보여요 · 고정한 공지는 맨 위에</div></div>
          <button class="btn btn-main" id="newNotice">+ 새 공지</button>
        </div>
        <div class="list" id="noticeList"></div>
      </section>

      <section id="tab-tags" class="hidden">
        <div class="section-head">
          <div><h2>해시태그</h2><div class="hint">적은 순서대로 사이트에 보여요</div></div>
        </div>
        <div class="item" style="flex-direction:column;align-items:stretch">
          <label class="f">해시태그 목록 <small>쉼표(,)로 구분해서 적어주세요. # 은 안 붙여도 돼요.</small>
            <input type="text" id="tagInput" />
          </label>
          <button class="btn btn-line" id="saveTags" style="align-self:flex-end">해시태그 저장</button>
        </div>
      </section>
    </div>

    <div class="bottom">
      <div class="bottom-inner">
        <div class="status" id="status"></div>
        <button class="btn btn-ghost" id="previewBtn">미리보기</button>
        <button class="btn btn-main" id="publishBtn">사이트에 올리기</button>
      </div>
    </div>
  </div>

  <!-- 편집 창 -->
  <div class="overlay" id="overlay">
    <div class="editor" id="editor"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');</script>
  <script>
    /* =====================================================
       🔒 비밀번호 — 바꾸고 싶으면 Claude에게 말해주세요
       (여기엔 비밀번호 자체가 아니라 암호화된 값만 들어 있어요)
       ===================================================== */
    const PASSWORD_HASH = "49c08d224066b8c26802fc975c96c7b663ddf7aee62d235114a62b0c69a865a8";

    /* 사이트에 항상 들어가는 파일들 */
    const FIXED_FILES = [
      "index.html", "admin.html",
      "images/header.jpg", "images/profile.jpg", "images/profile-sm.jpg",
      "images/sticker-smile.png", "images/sticker-open.png"
    ];
    const IMG_W = 987, IMG_H = 1216;
    const DRAFT_KEY = "heart_admin_draft";

    /* ---------- 도구 ---------- */
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const clone = o => JSON.parse(JSON.stringify(o));
    const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
    // 마음에 들어요 120~980, 재게시는 그 10~35% 정도로 랜덤
    function randomCounts() {
      const likes = 120 + Math.floor(Math.random() * 861);
      const rts = Math.max(3, Math.round(likes * (0.10 + Math.random() * 0.25)));
      return { likes, rts };
    }
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }
    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    const store = {
      get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
      del(k) { try { localStorage.removeItem(k); } catch {} }
    };
    const I = {
      up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>`,
      down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`,
      edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>`,
      del: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`,
      x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`
    };

    /* ---------- 데이터 ---------- */
    let SERVER = clone(window.SITE_DATA || { tags: [], notices: [], posts: [] });
    SERVER.tags = SERVER.tags || []; SERVER.notices = SERVER.notices || []; SERVER.posts = SERVER.posts || [];
    let data = clone(SERVER);
    const sameAsServer = d => JSON.stringify({ t: d.tags, n: d.notices, p: d.posts }) === JSON.stringify({ t: SERVER.tags, n: SERVER.notices, p: SERVER.posts });

    function saveDraft() {
      if (sameAsServer(data)) { store.del(DRAFT_KEY); }
      else if (!store.set(DRAFT_KEY, data)) {
        toast("자동 저장 공간이 꽉 찼어요. 지금 업데이트 파일을 만들어주세요!");
      }
      renderStatus();
    }
    function changeCount() {
      if (sameAsServer(data)) return 0;
      let n = 0;
      const cmp = (a, b) => { const A = a.map(x => JSON.stringify(x)), B = new Set(b.map(x => JSON.stringify(x))); A.forEach(x => { if (!B.has(x)) n++; }); };
      cmp(data.posts, SERVER.posts); cmp(SERVER.posts, data.posts);
      cmp(data.notices, SERVER.notices); cmp(SERVER.notices, data.notices);
      if (JSON.stringify(data.tags) !== JSON.stringify(SERVER.tags)) n++;
      return n || 1;
    }
    function renderStatus() {
      const n = changeCount();
      $("status").innerHTML = n ? `아직 사이트에 안 올린 변경 <b>${n}개</b>` : "사이트와 같은 상태예요";
    }

    /* ---------- 잠금 ---------- */
    async function unlock() {
      $("lockView").classList.add("hidden");
      $("appView").classList.remove("hidden");
      try { sessionStorage.setItem("heart_admin_ok", "1"); } catch {}
      initApp();
    }
    $("lockForm").addEventListener("submit", async e => {
      e.preventDefault();
      if (!crypto.subtle) { $("pwErr").textContent = "이 주소에서는 열 수 없어요. https:// 사이트 주소로 열어주세요."; return; }
      if (await sha256($("pw").value) === PASSWORD_HASH) unlock();
      else { $("pwErr").textContent = "비밀번호가 달라요"; $("pw").select(); }
    });
    $("logoutBtn").onclick = () => { try { sessionStorage.removeItem("heart_admin_ok"); } catch {} location.reload(); };

    /* ---------- 화면 ---------- */
    let tab = "posts";
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
      tab = b.dataset.tab;
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === b));
      ["posts", "notices", "tags"].forEach(t => $("tab-" + t).classList.toggle("hidden", t !== tab));
    });

    function initApp() {
      const draft = store.get(DRAFT_KEY);
      if (draft && draft.posts && !sameAsServer(draft)) {
        const b = $("draftBanner");
        b.classList.remove("hidden");
        b.innerHTML = `<span>💜 아직 사이트에 안 올린 작업이 있어요. 이어서 할까요?</span>
          <button class="btn btn-main" id="useDraft">이어서 하기</button>
          <button class="btn btn-ghost" id="dropDraft">버리기</button>`;
        $("useDraft").onclick = () => { data = draft; b.classList.add("hidden"); renderAll(); };
        $("dropDraft").onclick = () => { if (confirmBox("저장 안 한 작업을 버릴까요? 되돌릴 수 없어요.")) { store.del(DRAFT_KEY); b.classList.add("hidden"); renderAll(); } };
      } else if (draft) { store.del(DRAFT_KEY); }
      renderAll();
    }
    function confirmBox(msg) { return window.confirm(msg); }

    function renderAll() { renderPosts(); renderNotices(); $("tagInput").value = data.tags.join(", "); renderStatus(); }

    const isNew = (item, list) => !SERVER[list].some(x => x.id && x.id === item.id);

    function renderPosts() {
      const el = $("postList");
      if (!data.posts.length) { el.innerHTML = `<div class="empty">아직 게시물이 없어요.<br/>"+ 새 게시물"을 눌러 첫 캐릭터를 올려보세요!</div>`; return; }
      el.innerHTML = data.posts.map((p, i) => `
        <div class="item">
          ${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="" />` : `<div class="thumb">${esc((p.name || "?").charAt(0))}</div>`}
          <div class="item-main">
            <div class="item-title">${esc(p.name || "(이름 없음)")}${p.adult ? `<span class="badge">19+</span>` : ""}${isNew(p, "posts") ? `<span class="badge new">NEW</span>` : ""}</div>
            <div class="item-sub">${esc(p.date || "")} · ${(p.tags || []).map(t => "#" + esc(t)).join(" ") || "태그 없음"}</div>
            <div class="item-sub">${esc(p.tagline || "")}</div>

    /* ---------- 업데이트 파일(zip) 만들기 ---------- */
    const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
    function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
    function makeZip(files) {   // files: [{name, bytes}] — 압축 없이 묶기(STORE)
      const enc = new TextEncoder(), parts = [], central = [];
      const d = new Date();
      const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
      const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
      let offset = 0;
      for (const f of files) {
        const name = enc.encode(f.name), crc = crc32(f.bytes), size = f.bytes.length;
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
        lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
        lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
        parts.push(new Uint8Array(lh.buffer), name, f.bytes);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
        ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
        ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
        ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
        ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
        central.push(new Uint8Array(ch.buffer), name);
        offset += 30 + name.length + size;
      }
      const cdSize = central.reduce((s, p) => s + p.length, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
      return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
    }
    const dataUrlBytes = url => { const b = atob(url.split(",")[1]); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
    async function fetchBytes(path) {
      const r = await fetch(path + (path.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(path);
      return new Uint8Array(await r.arrayBuffer());
    }

    async function exportZip(btn) {

        // 이미 사이트에 있는 파일들
        const keep = [...FIXED_FILES, ...out.posts.map(p => p.image).filter(src => src && !used.has(src) && !src.startsWith("http"))];
        for (const path of [...new Set(keep)]) files.push({ name: path, bytes: await fetchBytes(path) });

    /* =====================================================
       🚀 GitHub에 바로 올리기
       ===================================================== */
    const REPO = "heart-notis/heart-notis.github.io", BRANCH = "main";
    const TOKEN_KEY = "heart_gh_token";
    const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } };
    const setToken = t => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} };
    const toB64 = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };

    async function gh(path, opts = {}) {
      const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, {
        ...opts,
        cache: "no-store",
        headers: { Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) }
      });
      if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
      return r.status === 204 ? null : r.json();
    }
    async function fileSha(path) {
      try { return (await gh(`/contents/${path}?ref=${BRANCH}`)).sha; }
      catch (e) { if (e.status === 404) return null; throw e; }
    }
    async function putFile(path, bytes, message) {
      const sha = await fileSha(path);
      await gh(`/contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: toB64(bytes), branch: BRANCH, ...(sha ? { sha } : {}) }) });
    }
    function ghErrorText(e) {
      if (e.status === 401) return "열쇠(토큰)가 틀렸거나 기간이 끝났어요. ⚙️ 연결에서 다시 넣어주세요.";
      if (e.status === 403 || e.status === 404) return "열쇠(토큰)에 heart-notis.github.io 쓰기 권한이 없어요. ⚙️ 연결을 확인해주세요.";
      if (e.status === 409 || e.status === 422) return "GitHub가 잠깐 바빴어요. 한 번만 다시 눌러주세요.";
      return "인터넷 연결을 확인하고 다시 시도해주세요.";
    }

    $("publishBtn").onclick = async () => {
      if (!getToken()) { openSettings(true); return; }
      if (sameAsServer(data)) { toast("이미 사이트와 같은 상태예요"); return; }
      const btn = $("publishBtn");
      btn.disabled = true;
      const step = t => { btn.textContent = t; };
      try {
        const out = clone(data);
        const uploads = [];
        for (const p of out.posts) {
          if (p.image && p.image.startsWith("data:")) {
            const path = `images/post-${p.id}.jpg`;
            uploads.push({ path, bytes: dataUrlBytes(p.image), name: p.name });
            p.image = path;
          }
        }
        let n = 0;
        for (const u of uploads) { step(`사진 올리는 중 (${++n}/${uploads.length})`); await putFile(u.path, u.bytes, `사진 추가: ${u.name}`); }

        step("글 저장하는 중…");
        const js = "/* 이 파일은 제작자 페이지(admin.html)가 자동으로 만들어요. 직접 고치지 않아도 돼요. */\nwindow.SITE_DATA = " + JSON.stringify({ tags: out.tags, notices: out.notices, posts: out.posts }, null, 2) + ";\n";
        await putFile("data.js", new TextEncoder().encode(js), "게시물 · 공지 업데이트");

        // 지운 게시물의 사진 정리
        step("정리하는 중…");
        try {
          const used = new Set(out.posts.map(p => p.image));
          const list = await gh(`/contents/images?ref=${BRANCH}`);
          for (const f of list) {
            if (/^post-.*\.jpg$/.test(f.name) && !used.has(f.path)) {
              await gh(`/contents/${f.path}`, { method: "DELETE", body: JSON.stringify({ message: `사진 정리: ${f.name}`, sha: f.sha, branch: BRANCH }) });
            }
          }
        } catch (e) { console.warn("정리 건너뜀", e); }

        SERVER = clone(out); data = out;
        store.del(DRAFT_KEY); renderAll();
        showPublished();
      } catch (e) {
        console.error(e);
        toast(ghErrorText(e));
        if (e.status === 401 || e.status === 403 || e.status === 404) openSettings();
      } finally {
        btn.disabled = false; btn.textContent = "사이트에 올리기";
      }
    };
    function showPublished() {
      edit = { kind: "done" };
      $("editor").innerHTML = `
        <div class="ed-top"><h3>사이트에 올렸어요 💜</h3><button class="icon" data-close aria-label="닫기">${I.x}</button></div>
        <div class="ed-body done-card">
          <div>GitHub에 저장했어요. <b>1~2분 뒤</b> 사이트에 반영돼요.</div>
          <div class="hint">바로 안 보이면 잠깐 기다렸다가 사이트를 새로고침해주세요.</div>
        </div>
        <div class="ed-foot">
          <a class="btn btn-line" href="index.html" target="_blank" rel="noopener">사이트 보기 ↗</a>
          <button class="btn btn-main" data-close>확인</button>
        </div>`;
      $("overlay").classList.add("open");
    }

    /* ---------- ⚙️ 연결 설정 ---------- */
    $("settingsBtn").onclick = () => openSettings();
    function openSettings(needToken) {
      const has = !!getToken();
      edit = { kind: "settings" };
      $("editor").innerHTML = `
        <div class="ed-top"><h3>GitHub 연결</h3><button class="icon" data-close aria-label="닫기">${I.x}</button></div>
        <div class="ed-body">
          ${needToken ? `<div class="banner" style="margin:0"><span>바로 올리려면 처음 한 번 GitHub 열쇠(토큰)를 넣어주세요.</span></div>` : ""}
          <div class="hint" style="line-height:1.7">
            1. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">GitHub 토큰 만들기 ↗</a><br/>
            2. Resource owner: <b>heart-notis</b> · Repository access: <b>heart-notis.github.io</b>만<br/>
            3. Permissions → Repository → <b>Contents: Read and write</b><br/>
            4. 만든 토큰을 아래에 붙여넣기
          </div>
          <label class="f">GitHub 토큰 <small>이 브라우저에만 저장돼요. 다른 사람에게 보여주지 마세요.</small>
            <input type="password" id="tokenInput" placeholder="${has ? "저장된 토큰이 있어요 (바꾸려면 새로 붙여넣기)" : "github_pat_로 시작해요"}" autocomplete="off" />
          </label>
          <div class="hint" id="tokenStatus">${has ? "✅ 토큰이 저장돼 있어요" : "아직 토큰이 없어요"}</div>
          <hr style="border:none;border-top:1px solid var(--line)" />
          <div class="hint">예비용: GitHub 연결 없이 업데이트 파일(zip)로 받아서 Claude에게 보낼 수도 있어요.</div>
          <button class="btn btn-ghost" id="zipBtn" style="align-self:flex-start">zip 파일로 받기</button>
        </div>
        <div class="ed-foot">
          ${has ? `<button class="btn btn-danger" id="tokenDel">토큰 지우기</button>` : ""}
          <button class="btn btn-line" id="tokenTest">연결 확인</button>
          <button class="btn btn-main" id="tokenSave">저장</button>
        </div>`;
      $("overlay").classList.add("open"); document.body.style.overflow = "hidden";
      const status = t => { $("tokenStatus").textContent = t; };
      const saveInput = () => { const v = $("tokenInput").value.trim(); if (v) setToken(v); return v; };
      $("tokenSave").onclick = () => { if (saveInput()) { status("✅ 저장했어요"); toast("토큰을 저장했어요"); closeEditor(); } else status("토큰을 붙여넣어주세요"); };
      $("tokenTest").onclick = async () => {
        saveInput();
        if (!getToken()) { status("토큰을 붙여넣어주세요"); return; }
        status("확인하는 중…");
        try {
          const repo = await gh("");
          status(repo.permissions && repo.permissions.push ? "✅ 연결됐어요! 바로 올릴 수 있어요" : "⚠️ 연결은 됐는데 쓰기 권한이 없어요 (Contents: Read and write 확인)");
        } catch (e) { status("❌ " + ghErrorText(e)); }
      };
      if ($("tokenDel")) $("tokenDel").onclick = () => { setToken(""); toast("토큰을 지웠어요"); closeEditor(); };
      $("zipBtn").onclick = () => exportZip($("zipBtn"));
    }

    /* ---------- 시작 ---------- */
    try { if (sessionStorage.getItem("heart_admin_ok") === "1") unlock(); } catch {}
  </script>
</body>
</html>
